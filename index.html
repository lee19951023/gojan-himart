<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#a63235" />
    <meta
      name="description"
      content="롯데하이마트 신도시고잔점 새단장 오픈 페스티벌 및 진행 행사 안내"
    />
    <title>롯데하이마트 신도시고잔점 오픈 페스티벌</title>
    <style>
      :root {
        color-scheme: light;
        --festival-red: #a63235;
        --festival-red-dark: #7f2227;
        --ink: #181818;
        --muted: #6b6866;
        --paper: #f5f2ed;
        --white: #ffffff;
        --line: rgba(24, 24, 24, 0.12);
        --shadow: 0 16px 42px rgba(54, 35, 32, 0.13);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        background: #201a1a;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: #201a1a;
        color: var(--ink);
        font-family:
          Pretendard,
          "Noto Sans KR",
          "Apple SD Gothic Neo",
          "Malgun Gothic",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
      }

      .site-shell {
        width: min(100%, 500px);
        min-height: 100vh;
        margin: 0 auto;
        overflow: hidden;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .hero {
        position: relative;
        width: 100%;
        aspect-ratio: 941 / 1672;
        overflow: hidden;
        background: var(--festival-red);
      }

      .hero__poster {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .hero__hotspot {
        position: absolute;
        z-index: 2;
        top: 82.6%;
        bottom: 6.9%;
        border-radius: 2px;
        -webkit-tap-highlight-color: rgba(255, 255, 255, 0.2);
      }

      .hero__hotspot--main {
        left: 5.7%;
        width: 42.8%;
      }

      .hero__hotspot--more {
        right: 5.8%;
        width: 42.8%;
      }

      .hero__hotspot:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: -4px;
        background: rgba(255, 255, 255, 0.1);
      }

      .hero__hotspot:active {
        background: rgba(255, 255, 255, 0.12);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .events {
        scroll-margin-top: 1rem;
        padding: 2.8rem 1rem 3.35rem;
      }

      .section-eyebrow {
        margin: 0 0 0.55rem;
        color: var(--festival-red);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.15em;
      }

      .section-title {
        margin: 0;
        font-size: clamp(1.72rem, 7vw, 2.2rem);
        line-height: 1.22;
        letter-spacing: -0.05em;
      }

      .section-intro {
        margin: 0.8rem 0 1.7rem;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
        letter-spacing: -0.025em;
      }

      .event-list {
        display: grid;
        gap: 1.15rem;
      }

      .event-card {
        display: block;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 0.9rem;
        background: var(--white);
        color: var(--ink);
        text-decoration: none;
        box-shadow: 0 10px 26px rgba(46, 37, 35, 0.09);
        transition:
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      .event-card__image {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        background: #eeeeee;
      }

      .event-card__footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 1rem 1.05rem;
      }

      .event-card__title {
        min-width: 0;
        font-size: 1rem;
        font-weight: 850;
        line-height: 1.35;
        letter-spacing: -0.035em;
      }

      .event-card__action {
        flex: 0 0 auto;
        color: var(--festival-red);
        font-size: 0.88rem;
        font-weight: 850;
        white-space: nowrap;
      }

      .event-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 32px rgba(46, 37, 35, 0.15);
      }

      .event-card:focus-visible {
        outline: 3px solid var(--festival-red);
        outline-offset: 3px;
      }

      .location {
        padding: 3.15rem 1rem 2.3rem;
        background: var(--white);
        border-top: 1px solid var(--line);
      }

      .location__heading {
        margin-bottom: 1.45rem;
      }

      .map {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 0.9rem;
        background: #e8e5e1;
        box-shadow: 0 10px 26px rgba(46, 37, 35, 0.08);
      }

      .map iframe {
        width: 100%;
        height: 100%;
        border: 0;
        pointer-events: none;
      }

      .store-info {
        margin: 1.35rem 0 0;
        border-top: 1px solid var(--line);
      }

      .store-info__row {
        display: grid;
        grid-template-columns: 4.35rem minmax(0, 1fr);
        gap: 0.65rem;
        padding: 1rem 0;
        border-bottom: 1px solid var(--line);
      }

      .store-info dt,
      .store-info dd {
        margin: 0;
      }

      .store-info dt {
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 800;
        line-height: 1.55;
      }

      .store-info dd,
      .store-info dd a {
        font-size: 0.98rem;
        font-weight: 750;
        line-height: 1.55;
        letter-spacing: -0.025em;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.22rem;
      }

      .location__actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.7rem;
        margin-top: 1.35rem;
      }

      .location__button {
        display: flex;
        min-height: 3.25rem;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--festival-red);
        border-radius: 0.65rem;
        font-size: 0.95rem;
        font-weight: 850;
        text-decoration: none;
        transition:
          background-color 160ms ease,
          color 160ms ease,
          transform 160ms ease;
      }

      .location__button--primary {
        background: var(--festival-red);
        color: var(--white);
      }

      .location__button--secondary {
        background: var(--white);
        color: var(--festival-red);
      }

      .location__button:hover {
        transform: translateY(-2px);
      }

      .location__button--primary:hover {
        background: var(--festival-red-dark);
      }

      .location__button--secondary:hover {
        background: #fff5f4;
      }

      .location__button:focus-visible {
        outline: 3px solid rgba(166, 50, 53, 0.3);
        outline-offset: 2px;
      }

      .page-footer {
        padding: 1.35rem 1rem calc(1.55rem + env(safe-area-inset-bottom));
        background: var(--white);
        text-align: center;
      }

      .page-footer__top {
        color: var(--muted);
        font-size: 0.85rem;
        text-underline-offset: 0.22rem;
      }

      @media (min-width: 501px) {
        body {
          padding: 2rem 0;
        }

        .site-shell {
          border-radius: 1.25rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .event-card,
        .location__button {
          transition: none;
        }
      }
    </style>
  </head>
